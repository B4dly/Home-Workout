<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeBulk — Build. Train. Progress.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220;
  --bg2:#0f1a2e;
  --card:#121e33;
  --card-hi:#17263f;
  --brick:#1c2c47;
  --accent:#2f7dfb;
  --accent-deep:#1a5ce0;
  --accent-soft:#2f7dfb22;
  --ember:#ff7a45;
  --good:#33d182;
  --text:#eef3fb;
  --text-dim:#8ea0bd;
  --border:#1e2c47;
  --radius:20px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{
  font-family:'Inter',sans-serif; color:var(--text);
  display:flex; justify-content:center;
}
#app{
  width:100%; max-width:480px; min-height:100vh; background:var(--bg);
  position:relative; overflow-x:hidden; display:flex; flex-direction:column;
  background-image:
    radial-gradient(circle at 15% 0%, #1a2c50 0%, transparent 45%),
    radial-gradient(circle at 100% 15%, #14213d 0%, transparent 40%);
}
.disp{font-family:'Archivo Black',sans-serif; letter-spacing:.5px;}
.mono{font-family:'JetBrains Mono',monospace;}
.screen{flex:1; display:flex; flex-direction:column; padding:24px 20px 100px; animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
h1,h2,h3,p{margin:0;}
.eyebrow{font-size:11px; letter-spacing:2.5px; color:var(--accent); font-weight:700; text-transform:uppercase;}
.btn{
  border:none; border-radius:16px; padding:16px 20px; font-family:'Inter'; font-weight:700;
  font-size:15px; cursor:pointer; text-align:center; transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep)); color:#fff; box-shadow:0 10px 24px -8px #1a5ce088;}
.btn-ghost{background:var(--card); color:var(--text); border:1px solid var(--border);}
.btn-ember{background:linear-gradient(135deg,var(--ember),#e8562a); color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:10px 14px; font-size:13px; border-radius:12px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.stack{display:flex; flex-direction:column; gap:12px;}
.pill{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:100px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:700;}
.tag{font-size:11px; padding:4px 10px; border-radius:100px; background:var(--card-hi); color:var(--text-dim); font-weight:600;}
input[type=text],input[type=number],select{
  width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text);
  padding:14px; border-radius:12px; font-family:'Inter'; font-size:15px;
}
.choice{border:1px solid var(--border); background:var(--bg2); border-radius:14px; padding:14px; display:flex; align-items:center; gap:12px; cursor:pointer;}
.choice.sel{border-color:var(--accent); background:var(--accent-soft);}
.choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
::-webkit-scrollbar{display:none;}

/* Splash */
.splash{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; position:relative;}
.logo-mark{width:96px; height:96px; position:relative;}
.logo-mark svg{width:100%; height:100%; filter:drop-shadow(0 12px 24px #1a5ce066);}
.splash h1{font-size:40px; letter-spacing:1px;}
.splash .tagline{font-size:12px; letter-spacing:4px; color:var(--text-dim); font-weight:700;}
.loadbar{width:160px; height:4px; border-radius:4px; background:var(--border); overflow:hidden; margin-top:10px;}
.loadbar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--ember)); animation:load 1.6s ease forwards;}
@keyframes load{to{width:100%;}}

/* Top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:20px 20px 6px;}
.iconbtn{width:38px; height:38px; border-radius:12px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text);}

/* Bottom nav */
.navbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#0d1526f0; backdrop-filter:blur(10px); border-top:1px solid var(--border); display:flex; padding:10px 6px calc(10px + env(safe-area-inset-bottom)); z-index:50;}
.navitem{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; font-weight:700; color:var(--text-dim); cursor:pointer; letter-spacing:.5px;}
.navitem.active{color:var(--accent);}
.navitem svg{width:20px; height:20px;}

/* Progress wall (signature element) */
.wall{display:grid; grid-template-columns:repeat(14,1fr); gap:3px;}
.brick{aspect-ratio:2/1; border-radius:2px; background:var(--brick);}
.brick.filled{background:linear-gradient(135deg,var(--accent),var(--ember));}

/* Rings */
.ring-wrap{position:relative; width:78px; height:78px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px;}

/* Exercise card */
.exrow{display:flex; align-items:center; gap:12px; padding:12px; border-radius:14px; background:var(--bg2); border:1px solid var(--border);}
.exrow .exicon{width:42px; height:42px; border-radius:12px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}

/* Timer */
.timer-big{font-family:'JetBrains Mono'; font-size:64px; font-weight:700; text-align:center; letter-spacing:1px;}
.progress-track{width:100%; height:8px; background:var(--border); border-radius:8px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--ember)); border-radius:8px; transition:width .3s ease;}

.list-clean{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px;}
.list-clean li{display:flex; gap:8px; font-size:13.5px; color:var(--text-dim); line-height:1.5;}
.list-clean li::before{content:'—'; color:var(--accent); flex-shrink:0;}

.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.week-tab{padding:8px 14px; border-radius:100px; font-size:12px; font-weight:700; background:var(--bg2); color:var(--text-dim); border:1px solid var(--border); cursor:pointer; white-space:nowrap;}
.week-tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.daychip{aspect-ratio:1; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; background:var(--bg2); border:1px solid var(--border); cursor:pointer; color:var(--text-dim);}
.daychip.done{background:var(--good); color:#04160c; border-color:var(--good);}
.daychip.today{border-color:var(--accent); color:var(--accent);}
.daychip.rest{background:var(--card-hi); color:var(--text-dim);}
.dayg{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ========================= DATA ========================= */
const EX = {

    mistakes:["Hips dropping mid-set","Very short range of motion"], easier:"inclinePushup", harder:null},
  tapPushup:{name:"Tap Push-ups", target:"Chest, shoulders, core stability", type:"reps", muscles:"chest",

  crunches:{name:"Crunches", target:"Upper abs", type:"reps", muscles:"core",

    mistakes:["Pulling on the neck","Using momentum"], easier:"kneeCrunches", harder:"bicycleCrunches"},
  situps:{name:"Sit-ups", target:"Full abdominal wall", type:"reps", muscles:"core",
    how:["Lie back, knees bent, feet anchored or flat.","Curl your torso all the way up toward your knees.","Lower back down with control.","Keep the movement smooth, not jerky."],

  flutterKicks:{name:"Flutter Kicks", target:"Lower abs, hip flexors", type:"reps", muscles:"core",

  legRaises:{name:"Leg Raises", target:"Lower abs", type:"reps", muscles:"core",

    mistakes:["Using momentum to swing legs up","Arching the lower back"], easier:"kneeCrunches", harder:"flutterKicks"},
  bicycleCrunches:{name:"Bicycle Crunches", target:"Obliques, upper & lower abs", type:"reps", muscles:"core",
    how:["Lie back, hands lightly behind your head.","Bring one elbow toward the opposite knee.","Extend the other leg out straight.","Alternate sides in a pedaling motion."],
    mistakes:["Pulling on the neck","Moving too fast with poor rotation"], easier:"crunches", harder:null},

    mistakes:["Letting feet touch down between reps","Rounding the shoulders"], easier:"kneeCrunches", harder:null},

  elbowPlank:{name:"Elbow Plank", target:"Core, shoulders", type:"time", muscles:"core",

const PROGRAMS = {
  chest:{name:"Chest Builder", icon:"💪", goal:"Improve pushing strength and chest development.",
    levels:{ beginner:[["inclinePushup",3,10],["pushup",3,6],["plank",3,20]],
      intermediate:[["pushup",3,12],["inclinePushup",3,10],["narrowPushup",3,8],["plank",3,35]],
      advanced:[["pushup",4,15],["declinePushup",3,10],["pikePushup",3,10],["tapPushup",3,10]] }},
  core:{name:"Abs & Core", icon:"🔥", goal:"Improve core strength and stability.",
    levels:{ beginner:[["kneeCrunches",3,10],["legRaises",3,8],["elbowPlank",3,20]],
      intermediate:[["situps",4,10],["flutterKicks",4,12],["legPullins",3,8],["plank",3,30]],
      advanced:[["bicycleCrunches",4,10],["bodySaw",4,10],["plankArmReaches",4,10],["elbowPlank",3,30]] }},
  legs:{name:"Lower Body", icon:"🦵", goal:"Improve lower-body strength.",
    levels:{ beginner:[["squats",3,10],["gluteBridges",3,10],["calfRaises",3,12]],
      intermediate:[["squats",4,15],["lunges",3,10],["wallSit",3,30],["calfRaises",3,15]],
      advanced:[["splitSquats",4,10],["lunges",4,12],["wallSit",3,45],["gluteBridges",4,15]] }},
  full:{name:"Full Body", icon:"⚡", goal:"Build general strength and conditioning.",
    levels:{ beginner:[["squats",3,10],["pushup",3,8],["lunges",3,8],["plank",3,20],["crunches",3,10]],
      intermediate:[["squats",3,15],["pushup",3,12],["lunges",3,12],["plank",3,35],["situps",3,12]],
      advanced:[["squats",4,18],["declinePushup",4,12],["splitSquats",4,12],["bodySaw",3,12],["wallSit",3,45]] }},
};

const GOALS = [
  {id:"chest", label:"Chest", desc:"Improve pushing strength and chest development.", icon:"💪"},
  {id:"arms", label:"Arms", desc:"Improve arm and upper-body strength.", icon:"🦾"},
  {id:"shoulders", label:"Shoulders", desc:"Develop shoulder strength.", icon:"🏋️"},
  {id:"core", label:"Core", desc:"Improve core strength and stability.", icon:"🔥"},
  {id:"legs", label:"Legs", desc:"Improve lower-body strength.", icon:"🦵"},
  {id:"full", label:"Full Body", desc:"Build general strength and conditioning.", icon:"⚡"},
  {id:"pushup", label:"Push-Up Progress", desc:"Improve push-up ability and technique.", icon:"📈"},
  {id:"challenge28", label:"28-Day Challenge", desc:"Complete a structured 28-day consistency challenge.", icon:"🗓️"},
];

const WEEK_LABEL = ["FOUNDATION","BUILD","PROGRESS","CHALLENGE"];
const DAY_TEMPLATES = [
  {tag:"FULL BODY", items:[["squats",3,10],["pushup",3,8],["lunges",3,10],["plank",3,20],["crunches",3,12]]},
  {tag:"CHEST + CORE", items:[["pushup",3,10],["inclinePushup",3,10],["plank",3,25],["situps",3,10]]},
  {tag:"LEGS + CARDIO", items:[["squats",3,12],["jumpingJacks",3,20],["lunges",3,10],["calfRaises",3,12]]},
  {tag:"ABS + MOBILITY", items:[["crunches",3,12],["flutterKicks",3,12],["buttKicks",3,20],["elbowPlank",3,25]]},
];
function scaleFor(week){ return [1,1.15,1.3,1.5][week-1]; }
function genDay(dayNum){
  const week = Math.ceil(dayNum/7);
  const dow = ((dayNum-1)%7)+1;
  if(dow===7) return {rest:true, week, tag:"REST DAY"};
  const tpl = DAY_TEMPLATES[(dayNum-1)%DAY_TEMPLATES.length];
  const f = scaleFor(week);
  const items = tpl.items.map(([id,sets,val])=>{
    const ex = EX[id];
    const scaled = Math.max(ex.type==="time"?10:5, Math.round(val*f / (ex.type==="time"?5:1)) * (ex.type==="time"?5:1));
    return [id, sets, scaled];
  });
  return {rest:false, week, tag:tpl.tag, items};
}

/* ========================= STATE ========================= */
let S = {
  screen:"splash",
  setupStep:0,
  profile:{name:"", age:"", experience:"Beginner", duration:"25", days:"4", equipment:[], voice:"off", voiceOn:true, volume:0.9, motivation:true},
  primaryGoal:null, secondaryGoals:[],
  streak:0, completedWorkouts:0, weekCompletedDays:[], challengeDone:Array(28).fill(false),
  pr:{pushups:0, squats:0, plankSec:0},
  activeWeekTab:1,
  library:{query:"", filter:"all"},
  detailExId:null, detailProgram:null, detailLevel:"beginner", detailDay:null,
  workoutSource:null, workout:null, exIdx:0, setIdx:0, exList:[],
  live:{phase:"idle", secondsLeft:0, reps:0, timerId:null, resting:false},
  theme:"dark",
};

function speak(text){
  if(!S.profile.voiceOn || S.profile.voice==="off") return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.volume = S.profile.volume; u.rate = 1; u.pitch = S.profile.voice==="female" ? 1.15 : 0.95;
    const voices = window.speechSynthesis.getVoices();
    let v = null;
    if(S.profile.voice==="female") v = voices.find(x=>/female|zira|samantha|victoria|karen/i.test(x.name));
    if(S.profile.voice==="male") v = voices.find(x=>/male|david|daniel|fred|alex/i.test(x.name));
    if(!v) v = voices.find(x=>x.lang && x.lang.startsWith("en"));
    if(v) u.voice = v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ========================= HELPERS ========================= */
function setS(patch){ Object.assign(S,patch); render(); }
function go(screen, patch={}){ Object.assign(S,{screen},patch); window.scrollTo(0,0); render(); }
function icon(name){

    dumbbell:'<path d="M3 9h2v6H3zM19 9h2v6h-2zM6 7h2v10H6zM16 7h2v10h-2zM9 11h6v2H9z"/>',

  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${M[name]||""}</svg>`;
}
function ring(pct,label){
  const r=32, c=2*Math.PI*r, off=c-(pct/100)*c;
  return `<div class="ring-wrap"><svg width="78" height="78"><circle cx="39" cy="39" r="${r}" stroke="#1e2c47" stroke-width="7" fill="none"/>
  <circle cx="39" cy="39" r="${r}" stroke="url(#g1)" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2f7dfb"/><stop offset="100%" stop-color="#ff7a45"/></linearGradient></defs></svg>
  <div class="ring-num">${label}</div></div>`;

function startWorkout(source, program, level, dayNum){
  let items, tag;
  if(source==="today"){ const w = todaysWorkout(); items=w.items; tag=w.tag; }
  else if(source==="program"){ items = PROGRAMS[program].levels[level]; tag = PROGRAMS[program].name.toUpperCase()+" · "+level.toUpperCase(); }
  else if(source==="challenge"){ const d = genDay(dayNum); items = d.items; tag = "DAY "+dayNum+" — "+d.tag; }
  S.workoutSource = {source, program, level, dayNum};
  S.exList = items;
  S.exIdx = 0; S.setIdx = 0;
  S.workoutTag = tag;
  S.live = {phase:"idle", secondsLeft:0, reps:0, timerId:null, resting:false};
  go("exerciseInstr");
}

function useEasier(){
  const [id,sets,val] = currentEx();
  const easierId = EX[id].easier;
  if(easierId){ S.exList[S.exIdx] = [easierId, sets, val]; render(); }
}
function beginExercise(){
  S.setIdx = 0;
  const [id,,val] = currentEx();
  const ex = EX[id];
  speak(`${ex.name}. Get into position. Ready. Three, two, one, start.`);
  go("liveWorkout");
  startSet();
}
function startSet(){
  const [id,,val] = currentEx();
  const ex = EX[id];
  clearInterval(S.live.timerId);
  if(ex.type==="time"){
    S.live = {phase:"active", secondsLeft:val, reps:0, resting:false};
    S.live.timerId = setInterval(()=>{
      S.live.secondsLeft--;
      if(S.live.secondsLeft===5) speak("Five more seconds.");
      if(S.live.secondsLeft<=0){ clearInterval(S.live.timerId); finishSet(); return; }
      render();
    },1000);
  } else {
    S.live = {phase:"active", secondsLeft:0, reps:0, resting:false, target:val};
  }
  render();
}
function logRep(){
  S.live.reps++;
  if(S.live.reps >= S.live.target){ speak("Set complete. Great work."); finishSet(); }
  else if(S.live.reps === S.live.target-2){ speak("Two more."); render(); }
  else render();
}
function finishSet(){
  const [id,sets] = currentEx();
  if(S.setIdx < sets-1){
    S.setIdx++;
    S.live = {phase:"rest", secondsLeft:60, resting:true};
    speak("Rest for 60 seconds.");
    S.live.timerId = setInterval(()=>{
      S.live.secondsLeft--;
      if(S.live.secondsLeft<=0){ clearInterval(S.live.timerId); startSet(); return; }
      render();
    },1000);
    render();
  } else {
    nextExercise();
  }
}
function adjustRest(sec){ if(S.live.phase==="rest"){ S.live.secondsLeft = Math.max(0,S.live.secondsLeft+sec); render(); } }
function skipRest(){ clearInterval(S.live.timerId); startSet(); }
function nextExercise(){
  clearInterval(S.live.timerId);
  if(S.exIdx < S.exList.length-1){
    S.exIdx++; S.setIdx=0;
    const nx = EX[currentEx()[0]];
    speak("Next exercise: "+nx.name+".");
    go("exerciseInstr");
  } else {
    completeWorkout();
  }
}
function endWorkoutEarly(){ clearInterval(S.live.timerId); go("dashboard"); }
function completeWorkout(){
  S.streak++; S.completedWorkouts++;
  if(!S.weekCompletedDays.includes(S.completedWorkouts)) S.weekCompletedDays.push(S.completedWorkouts);
  if(S.weekCompletedDays.length > Number(S.profile.days)) S.weekCompletedDays.shift();
  if(S.workoutSource && S.workoutSource.source==="challenge"){
    S.challengeDone[S.workoutSource.dayNum-1] = true;
  }
  speak("Workout complete. Progress saved. Great job today.");
  go("workoutComplete");
}

function screenChallenge(){
  const wk = S.activeWeekTab;
  return `
  ${topbarMain("CHALLENGE")}
  <div class="screen" style="padding-top:6px;">
    <h2 class="disp" style="font-size:22px;">28-Day Challenge</h2>
    <div class="card" style="margin-top:14px;">
      <div class="row"><b style="font-size:13px;">Overall progress</b><span class="tag">${S.challengeDone.filter(Boolean).length} / 28 days</span></div>
      <div style="margin-top:10px;">${wall(28, S.challengeDone.filter(Boolean).length)}</div>
    </div>
    <div class="chip-row" style="margin-top:16px;">
      ${[1,2,3,4].map(w=>`<div class="week-tab ${wk===w?'active':''}" onclick="S.activeWeekTab=${w};render()">WEEK ${w} — ${WEEK_LABEL[w-1]}</div>`).join("")}
    </div>
    <div class="dayg" style="margin-top:16px;">
      ${Array.from({length:7},(_,i)=>{
        const dayNum = (wk-1)*7+i+1;

  </div>`;
}
function screenChallengeDay(){

    return `
    <div class="topbar"><div class="iconbtn" onclick="go('challenge')">←</div><b>DAY ${dayNum}</b><div style="width:38px;"></div></div>
    <div class="screen" style="justify-content:center;align-items:center;text-align:center;">
      <div style="font-size:50px;">😴</div>
      <h2 class="disp" style="font-size:22px;margin-top:8px;">REST DAY</h2>
      <p style="color:var(--text-dim);margin-top:8px;">Recovery is part of the plan. Light walking or stretching is great today.</p>
      <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="go('challenge')">BACK TO CHALLENGE</button>
    </div>`;
  }
  return `
  <div class="topbar"><div class="iconbtn" onclick="go('challenge')">←</div><b>DAY ${dayNum}</b><div style="width:38px;"></div></div>
  <div class="screen" style="padding-top:6px;">
    <p class="eyebrow">WEEK ${d.week} — ${WEEK_LABEL[d.week-1]}</p>
    <h2 class="disp" style="font-size:24px;margin-top:6px;">${d.tag}</h2>
    <div class="stack" style="margin-top:16px;">
      ${d.items.map(([id,sets,val])=>{const ex=EX[id];return `
      <div class="exrow"><div class="exicon">🏋️</div><div style="flex:1;"><b style="font-size:13.5px;">${ex.name}</b><div style="color:var(--text-dim);font-size:12px;">${sets} × ${val}${ex.type==='time'?' sec':''}</div></div>

}

function screenLibrary(){
  const q = S.library.query.toLowerCase();
  const filter = S.library.filter;
  const list = Object.entries(EX).filter(([id,ex])=>{
    const matchQ = ex.name.toLowerCase().includes(q);
    const matchF = filter==="all" || ex.muscles===filter;
    return matchQ && matchF;
  });
  const groups = {chest:"Chest",core:"Core",legs:"Legs",full:"Full Body"};
  return `
  ${topbarMain("EXERCISES")}
  <div class="screen" style="padding-top:6px;">
    <h2 class="disp" style="font-size:22px;">Exercise Library</h2>
    <input type="text" placeholder="Search exercises…" value="${S.library.query}" oninput="S.library.query=this.value;render()" style="margin-top:14px;">
    <div class="chip-row" style="margin-top:12px;">
      ${["all","chest","core","legs","full"].map(f=>`<div class="week-tab ${filter===f?'active':''}" onclick="S.library.filter='${f}';render()">${f==='all'?'All':groups[f]}</div>`).join("")}
    </div>
    <div class="stack" style="margin-top:16px;">
      ${list.map(([id,ex])=>`
      <div class="exrow" style="cursor:pointer;" onclick="go('exerciseDetail',{detailExId:'${id}'})">
        <div class="exicon">🏋️</div>
        <div style="flex:1;"><b style="font-size:13.5px;">${ex.name}</b><div style="color:var(--text-dim);font-size:12px;">${ex.target}</div></div>
        <span style="color:var(--text-dim);">›</span>
      </div>`).join("") || `<p style="color:var(--text-dim);text-align:center;margin-top:20px;">No exercises found.</p>`}
    </div>
  </div>`;
}
function screenExerciseDetail(){
  const id = S.detailExId; const ex = EX[id];
  return `
  <div class="topbar"><div class="iconbtn" onclick="history.back?go('library'):go('library')">←</div><b>${ex.name}</b><div style="width:38px;"></div></div>
  <div class="screen" style="padding-top:6px;">
    <div class="card" style="height:130px;display:flex;align-items:center;justify-content:center;font-size:50px;background:linear-gradient(135deg,var(--accent-soft),var(--card));">🏋️</div>
    <p style="color:var(--text-dim);font-size:13px;margin-top:12px;">Target: ${ex.target} · ${ex.type==='time'?'Timed hold':'Rep-based'}</p>

function screenProgress(){
  const wk = Math.round((S.weekCompletedDays.length/Number(S.profile.days))*100);
  return `
  ${topbarMain("PROGRESS")}
  <div class="screen" style="padding-top:6px;">
    <h2 class="disp" style="font-size:22px;">Your Progress</h2>
    <div class="row" style="margin-top:16px;gap:12px;">
      ${ring(Math.min(wk,100), wk+'%')}
      <div style="flex:1;">
        <b style="font-size:13.5px;">Weekly consistency</b>
        <p style="color:var(--text-dim);font-size:12px;margin-top:4px;">${S.weekCompletedDays.length} of ${S.profile.days} planned days this week</p>
      </div>
    </div>
    <div class="row" style="margin-top:16px;gap:12px;">
      <div class="card" style="flex:1;text-align:center;"><div style="font-size:22px;">🔥</div><b class="disp">${S.streak}</b><div style="color:var(--text-dim);font-size:11px;">Streak</div></div>
      <div class="card" style="flex:1;text-align:center;"><div style="font-size:22px;">✅</div><b class="disp">${S.completedWorkouts}</b><div style="color:var(--text-dim);font-size:11px;">Workouts</div></div>
      <div class="card" style="flex:1;text-align:center;"><div style="font-size:22px;">🗓️</div><b class="disp">${S.challengeDone.filter(Boolean).length}</b><div style="color:var(--text-dim);font-size:11px;">Challenge days</div></div>
    </div>
    <div class="card" style="margin-top:14px;">
      <b style="font-size:13px;">28-DAY CHALLENGE</b>
      <div style="margin:10px 0;">${wall(28, S.challengeDone.filter(Boolean).length)}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.round(S.challengeDone.filter(Boolean).length/28*100)}%;"></div></div>
      <p style="color:var(--text-dim);font-size:11.5px;margin-top:6px;">${S.challengeDone.filter(Boolean).length} / 28 days</p>
    </div>
    <div class="card" style="margin-top:14px;">
      <b style="font-size:13px;">PERSONAL RECORDS</b>
      <p style="color:var(--text-dim);font-size:11.5px;margin-top:4px;">Log your best numbers manually.</p>
      <div class="stack" style="margin-top:12px;">
        <div class="row"><span>Max push-ups</span><input type="number" style="width:80px;padding:8px;" value="${S.pr.pushups}" oninput="S.pr.pushups=this.value"></div>
        <div class="row"><span>Max squats</span><input type="number" style="width:80px;padding:8px;" value="${S.pr.squats}" oninput="S.pr.squats=this.value"></div>
        <div class="row"><span>Plank hold (sec)</span><input type="number" style="width:80px;padding:8px;" value="${S.pr.plankSec}" oninput="S.pr.plankSec=this.value"></div>
      </div>
      <button class="btn btn-ghost btn-block" style="margin-top:12px;" onclick="render()">SAVE RECORDS</button>
    </div>
  </div>`;
}

function screenRestDay(){
  return `
  ${topbarMain("HOME")}
  <div class="screen" style="justify-content:center;align-items:center;text-align:center;padding-top:6px;">
    <div style="font-size:50px;">😴</div>
    <h2 class="disp" style="font-size:22px;margin-top:8px;">TODAY IS A REST DAY</h2>
    <p style="color:var(--text-dim);margin-top:8px;">Recovery drives growth just as much as training does. Keep it light today.</p>
    <div class="stack" style="width:100%;margin-top:20px;">
      <div class="exrow"><div class="exicon">🚶</div><div><b style="font-size:13.5px;">Walking</b><div style="color:var(--text-dim);font-size:12px;">15–20 minutes, easy pace</div></div></div>
      <div class="exrow"><div class="exicon">🧘</div><div><b style="font-size:13.5px;">Gentle mobility</b><div style="color:var(--text-dim);font-size:12px;">Hips, shoulders, spine</div></div></div>
      <div class="exrow"><div class="exicon">🤸</div><div><b style="font-size:13.5px;">Stretching</b><div style="color:var(--text-dim);font-size:12px;">5–10 minutes, full body</div></div></div>
    </div>
    <p style="color:var(--text-dim);font-size:11.5px;margin-top:16px;">Never train through pain — rest is part of the program, not a break from it.</p>
    <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="go('dashboard')">BACK TO HOME</button>

}

  const items = [
    ["🍗 Protein-rich foods","Supports muscle repair and growth — eggs, chicken, fish, beans, tofu, dairy."],
    ["🍠 Carbohydrates","Fuels your workouts and recovery — whole grains, rice, oats, potatoes."],
    ["🥦 Fruits & vegetables","Micronutrients and fiber to support overall health."],
    ["🥑 Healthy fats","Supports hormone health — nuts, seeds, olive oil, avocado."],
    ["💧 Water","Stay consistently hydrated throughout the day."],
    ["🍽 Regular meals","Aim for steady, balanced meals rather than skipping."],
    ["😴 Adequate sleep","7–9 hours supports recovery and progress."],
  ];
  return `
  <div class="topbar"><div class="iconbtn" onclick="go('dashboard')">←</div><b>Nutrition</b><div style="width:38px;"></div></div>
  <div class="screen" style="padding-top:6px;">
    <h2 class="disp" style="font-size:22px;">Nutrition for Strength</h2>
    <p style="color:var(--text-dim);font-size:13px;margin-top:6px;">Simple, balanced guidance — no extreme diets or supplements needed.</p>
    <div class="stack" style="margin-top:16px;">
      ${items.map(([t,d])=>`<div class="card"><b style="font-size:13.5px;">${t}</b><p style="color:var(--text-dim);font-size:12.5px;margin-top:6px;">${d}</p></div>`).join("")}
    </div>
    <div class="card" style="margin-top:14px;background:var(--accent-soft);">
      <p style="font-size:12px;color:var(--text-dim);">This is general guidance, not medical or dietary advice. Adjust to your own needs, and speak with a professional for anything specific to your health.</p>
    </div>

function screenSettings(){
  const p = S.profile;
  return `
  <div class="topbar"><div class="iconbtn" onclick="go('dashboard')">←</div><b>Settings</b><div style="width:38px;"></div></div>
  <div class="screen" style="padding-top:6px;">
    <div class="card">
      <b style="font-size:13px;">PROFILE</b>
      <div class="row" style="margin-top:10px;"><span style="color:var(--text-dim);">Name</span><b>${p.name||'—'}</b></div>
      <div class="row" style="margin-top:8px;"><span style="color:var(--text-dim);">Experience</span><b>${p.experience}</b></div>
      <div class="row" style="margin-top:8px;"><span style="color:var(--text-dim);">Schedule</span><b>${p.days} days · ${p.duration} min</b></div>
      <div class="row" style="margin-top:8px;"><span style="color:var(--text-dim);">Goal</span><b>${(GOALS.find(g=>g.id===S.primaryGoal)||{}).label||'—'}</b></div>
      <button class="btn btn-ghost btn-block" style="margin-top:12px;" onclick="go('setup',{setupStep:0})">Edit profile</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="go('goals',{fromSettings:true})">Change goal</button>
    </div>

    <div class="card" style="margin-top:14px;">
      <b style="font-size:13px;">VOICE COACH</b>
      <div class="stack" style="margin-top:10px;">
        <div class="row"><span>Voice on/off</span><input type="checkbox" ${p.voiceOn?'checked':''} onchange="S.profile.voiceOn=this.checked;render()"></div>
        <div class="row"><span>Voice</span>
          <select onchange="S.profile.voice=this.value;render()">
            <option value="male" ${p.voice==='male'?'selected':''}>Male</option>
            <option value="female" ${p.voice==='female'?'selected':''}>Female</option>
            <option value="off" ${p.voice==='off'?'selected':''}>Off</option>
          </select>
        </div>
        <div class="row"><span>Motivation messages</span><input type="checkbox" ${p.motivation?'checked':''} onchange="S.profile.motivation=this.checked;render()"></div>
        <button class="btn btn-ghost btn-block" onclick="testVoice()">🎧 Test Voice</button>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <b style="font-size:13px;">NOTIFICATIONS</b>
      <div class="row" style="margin-top:10px;"><span>Workout reminders</span><input type="checkbox" checked></div>
      <div class="row" style="margin-top:8px;"><span>Recovery reminders</span><input type="checkbox" checked></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <b style="font-size:13px;">MORE</b>
      <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="go('nutrition')">🍎 Nutrition guide</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="alert('This application provides general fitness guidance. Start at a level appropriate for you, use proper technique, and stop if an exercise causes pain. If you have an injury or medical condition, consult a qualified professional before starting a new exercise program.')">⚠️ Safety disclaimer</button>
      <button class="btn btn-ember btn-block" style="margin-top:8px;" onclick="resetProgress()">Reset progress</button>
    </div>
  </div>`;
}
function resetProgress(){
  if(!confirm("Reset all progress? This cannot be undone.")) return;
  S = {...S, streak:0, completedWorkouts:0, weekCompletedDays:[], challengeDone:Array(28).fill(false), pr:{pushups:0,squats:0,plankSec:0}};
  go("dashboard");
}

/* ========================= RENDER ROOT ========================= */
function render(){
  const app = document.getElementById("app");
  let html = "";
  switch(S.screen){
    case "splash": html = screenSplash(); break;
    case "setup": html = screenSetup(); break;
    case "goals": html = screenGoals(S.fromSettings); break;
    case "dashboard": html = screenDashboard(); break;
    case "exerciseInstr": html = screenExerciseInstr(); break;
    case "liveWorkout": html = screenLiveWorkout(); break;
    case "workoutComplete": html = screenWorkoutComplete(); break;
    case "programs": html = screenGoalsHub(); break;
    case "programDetail": html = screenProgramDetail(); break;
    case "challenge": html = screenChallenge(); break;
    case "challengeDay": html = screenChallengeDay(); break;
    case "library": html = screenLibrary(); break;
    case "exerciseDetail": html = screenExerciseDetail(); break;
    case "progress": html = screenProgress(); break;
    case "restday": html = screenRestDay(); break;
    case "nutrition": html = screenNutrition(); break;
    case "settings": html = screenSettings(); break;
    default: html = screenDashboard();
  }
  const showNav = ["dashboard","programs","challenge","library","progress"].includes(S.screen);
  app.innerHTML = html + (showNav ? navBar() : "");
}
function navBar(){
  const items = [
    ["dashboard","home","HOME"],
    ["programs","dumbbell","WORKOUTS"],
    ["challenge","calendar","CHALLENGE"],
    ["library","list","EXERCISES"],
    ["progress","chart","PROGRESS"],
  ];
  return `<div class="navbar">${items.map(([s,ic,label])=>`
    <div class="navitem ${S.screen===s?'active':''}" onclick="go('${s}')">${icon(ic)}<span>${label}</span></div>`).join("")}</div>`;
}

window.speechSynthesis && (window.speechSynthesis.onvoiceschanged = ()=>{});
render();
</script>
</body>
</html>
